name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  build:
    name: Build, testes e formatação
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependências
        run: dotnet restore .\DearNotes.slnx

      - name: Verificar formatação
        run: dotnet format .\DearNotes.slnx --verify-no-changes --no-restore

      - name: Compilar
        run: dotnet build .\DearNotes.slnx --configuration Release --no-restore

      - name: Executar testes
        run: dotnet test .\DearNotes.slnx --configuration Release --no-build
